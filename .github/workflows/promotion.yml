name: 프로모션 수정

on:
  workflow_dispatch:
    inputs:
      target:
        description: '작품 ID 또는 정확한 제목'
        required: true
        type: string
      promotion:
        description: '프로모션 문구 (비우면 삭제)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kakao-showcase-collector
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 프로모션 저장
        env:
          PROMOTION_TARGET: ${{ inputs.target }}
          PROMOTION_TEXT: ${{ inputs.promotion }}
        run: python scripts/update_promotion.py

      - name: 변경 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/showcase_history.json index.html
          if git diff --cached --quiet; then
            echo "저장할 변경 내용이 없습니다."
          else
            git commit -m "프로모션 수정"
            git push
          fi

      - name: Pages 배포 파일 준비
        run: |
          rm -rf site
          mkdir site
          cp index.html site/index.html

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: Pages 파일 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
