name: 매일 오전 11시 30분 데이터 수집

on:
  schedule:
    - cron: '30 11 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      force_same_day:
        description: '오늘 이미 수집했어도 한 번 더 수집'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kakao-showcase-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 수집 및 웹페이지 갱신
        env:
          FORCE_SAME_DAY: ${{ inputs.force_same_day || false }}
        run: |
          if [ "$FORCE_SAME_DAY" = "true" ]; then
            python cloud_collect.py --force-same-day
          else
            python cloud_collect.py
          fi

      - name: 변경 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json data/showcase_history.json index.html
          if git diff --cached --quiet; then
            echo "저장할 변경 내용이 없습니다."
          else
            git commit -m "자동 수집: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: Pages 배포 파일 준비
        run: |
          rm -rf site
          mkdir site
          cp index.html site/index.html

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: Pages 파일 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
